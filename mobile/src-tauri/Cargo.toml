[package]
name = "deepseek-agent-mobile"
version = "0.1.0"
edition = "2021"

[lib]
name = "deepseek_agent_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tauri = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
