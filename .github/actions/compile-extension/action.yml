name: Compile extension
description: Type-check and build the extension and its webview
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - shell: bash
      run: npm install --global npm@12.2.1
    - shell: bash
      run: npm ci
    - shell: bash
      run: npm run compile
    - shell: bash
      run: npm run build
