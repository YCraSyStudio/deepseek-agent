name: Mobile IDE Android MVP

on:
  push:
    branches: [feat/mobile-ide-mvp]
    paths:
      - '.github/workflows/mobile-android-mvp.yml'
      - 'legacy/tauri/**'
      - 'apps/vscode/src/vscode/mobileIde/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: legacy/tauri
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: legacy/tauri/package-lock.json
      - run: npm ci
      - run: rustup target add aarch64-linux-android
      - run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)}"
          test -x "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          npm run tauri -- android init --ci --skip-targets-install
          cp android/MainActivity.kt \
            src-tauri/gen/android/app/src/main/java/com/ycrasystudio/deepseekagent/mobile/MainActivity.kt
          npm run tauri -- android build --debug --apk --target aarch64
      - name: Verify Android signature
        run: |
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          "$signer" verify --verbose "$apk"
      - uses: actions/upload-artifact@v7
        with:
          name: deepseek-agent-mobile-android-arm64
          path: legacy/tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
